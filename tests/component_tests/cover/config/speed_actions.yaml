esphome:
  name: test
  on_boot:
    - cover.open:
        id: blind
        speed: slow
    - cover.close: blind
    - cover.control:
        id: blind
        position: 50%
        speed: !lambda 'return std::string("fast");'

esp8266:
  board: esp01_1m

cover:
  - platform: template
    id: blind
    name: Blind
    optimistic: true
