esphome:
  name: test

logger:

esp32:
  board: nodemcu-32s

wifi:
  ssid: MySSID
  password: password1

uart:
  - id: serial_bus
    tx_pin: GPIO17
    rx_pin: GPIO16
    baud_rate: 9600

tcp_uart:
  - id: remote_link
    host: 192.0.2.10
    port: 4000
  - id: inbound
    role: server
    port: 4001

rfc2217_uart:
  - id: remote_port
    tcp_uart_id: remote_link
    baud_rate: 19200
    parity: EVEN
    stop_bits: 2
    data_bits: 7
    debug:
  - id: port_server
    tcp_uart_id: inbound
    role: server
    uart_id: serial_bus
