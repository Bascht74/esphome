uart_split:
  - id: split_bus
    uart_id: uart_bus
    outputs:
      - id: bus
        debug:
      - id: tap
        rx_only: true
        direction: BOTH
      - id: pins_only
        rx_only: true
        direction: RX
      - id: distance_tap
        rx_only: true
  # Two outputs write, so they take turns on bus.
  - id: split_arbitrated
    uart_id: bus
    send_wait_time: 1024ms
    turnaround_time: 50ms
    outputs:
      - id: requester_a
      - id: requester_b
      - id: line_tap
        rx_only: true
        direction: BOTH

# Checks the baud rate of its UART: an output reports the one of uart_bus.
sensor:
  - platform: a01nyub
    uart_id: distance_tap
    name: Distance

interval:
  - interval: 60s
    then:
      - lambda: |-
          uint8_t byte;
          if (id(tap).read_byte(&byte)) {
            id(pins_only).read_byte(&byte);
          }
          if (id(requester_a).available_for_write() > 0) {
            id(requester_a).write_byte(0x01);
          }
          if (id(requester_b).read_byte(&byte)) {
            id(line_tap).read_byte(&byte);
          }
