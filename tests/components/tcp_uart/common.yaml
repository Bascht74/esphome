wifi:
  ssid: MySSID
  password: password1

tcp_uart:
  - id: tcp_uart_1
    host: 192.0.2.10
    port: 502
    reconnect_interval: 10s
    connected:
      name: TCP UART Connected
  - id: tcp_uart_modbus
    host: 192.0.2.11
    port: 502
    protocol: modbus

interval:
  - interval: 60s
    then:
      - lambda: |-
          uint8_t byte;
          if (id(tcp_uart_1).available() && id(tcp_uart_1).read_byte(&byte)) {
            id(tcp_uart_1).write_byte(byte);
          }
