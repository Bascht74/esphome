wifi:
  ssid: MySSID
  password: password1

tcp_uart:
  - id: tcp_uart_1
    host: 192.0.2.10
    port: 502
    reconnect_interval: 5s
    connected:
      name: TCP UART Connected
  - id: tcp_uart_server
    role: server
    port: 5020
    allowed_hosts:
      - 192.0.2.20

interval:
  - interval: 60s
    then:
      - lambda: |-
          uint8_t byte;
          if (id(tcp_uart_1).available() && id(tcp_uart_1).read_byte(&byte)) {
            id(tcp_uart_1).write_byte(byte);
          }
